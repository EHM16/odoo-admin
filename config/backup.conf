# ============================================================
# Backup Configuration
# ============================================================

BACKUP_ROOT="${ODOO_ADMIN_BACKUP}"

DAILY_DIR="${BACKUP_ROOT}/daily"
WEEKLY_DIR="${BACKUP_ROOT}/weekly"
MONTHLY_DIR="${BACKUP_ROOT}/monthly"
ARCHIVE_DIR="${BACKUP_ROOT}/archive"

TARGET_DIR="${DAILY_DIR}"

BACKUP_PREFIX="Prysme"

BACKUP_FORMAT="custom"

DATE_FORMAT="+%Y-%m-%d_%H-%M-%S"

SPACE_FACTOR=2

COMPRESSION_LEVEL=6

RETENTION_DAILY=7
RETENTION_WEEKLY=4
RETENTION_MONTHLY=12

# flock keeps the lock on the open descriptor for the lifetime of backup.sh.
BACKUP_LOCK_FILE="${BACKUP_LOCK_FILE:-/run/lock/odoo-admin-backup.lock}"
